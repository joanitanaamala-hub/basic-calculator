<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Web Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator interface design">
    <div class="display" aria-label="Calculator display">0</div>

    <section class="keypad" aria-label="Calculator keypad">
      <button class="key clear">AC</button>
      <button class="key">00</button>
      <button class="key">%</button>
      <button class="key operator">÷</button>

      <button class="key">7</button>
      <button class="key">8</button>
      <button class="key">9</button>
      <button class="key operator">x</button>

      <button class="key">4</button>
      <button class="key">5</button>
      <button class="key">6</button>
      <button class="key operator">−</button>

      <button class="key">1</button>
      <button class="key">2</button>
      <button class="key">3</button>
      <button class="key operator">+</button>

      <button class="key zero">0</button>
      <button class="key decimal">.</button>
      <button class="key operator">=</button>
    </section>
  </main>
</body>
</html>
